<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inbox &amp; Inquiries — Lawish Kumar Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --accent-orange: #FF5A1F;
      --accent-blue: #3D7EFF;
      --accent-green: #34D399;
      --text-white: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.72);
      --text-dim: rgba(255, 255, 255, 0.45);
      --border-subtle: rgba(255, 255, 255, 0.14);
      --card-bg: rgba(20, 24, 36, 0.55);
      --card-bg-hover: rgba(26, 32, 48, 0.75);
    }

    body {
      width: 100%;
      min-height: 100vh;
      background-color: #0A0C13;
      background-image: 
        radial-gradient(circle at 14% 10%, rgba(255, 60, 20, 0.14) 0%, transparent 42%),
        radial-gradient(circle at 86% 38%, rgba(255, 90, 31, 0.10) 0%, transparent 45%),
        linear-gradient(180deg, #090B11 0%, #0D101A 40%, #0A0C14 100%);
      background-attachment: fixed;
      color: var(--text-white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* HEADER */
    header {
      padding: 1.8rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(10, 12, 19, 0.8);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-logo .dot {
      width: 8px;
      height: 8px;
      background: var(--accent-orange);
      border-radius: 50%;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #fff;
    }

    /* MAIN INBOX */
    main {
      padding: 3.5rem 0 6rem 0;
    }

    .inbox-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    .inbox-title h1 {
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .inbox-title p {
      color: var(--text-muted);
      font-size: 1rem;
      margin-top: 0.4rem;
    }

    .inbox-actions-group {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn {
      padding: 0.65rem 1.3rem;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      text-decoration: none;
      border: none;
      outline: none;
    }

    .btn-primary {
      background: var(--accent-orange);
      color: #fff;
    }

    .btn-primary:hover {
      background: #e64a12;
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: #fff;
    }

    .btn-outline:hover {
      border-color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    /* STATUS BANNER */
    .smtp-banner {
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 1.2rem 1.6rem;
      margin-bottom: 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      background: rgba(255, 255, 255, 0.03);
    }

    .smtp-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .status-dot.active {
      background: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
    }

    .status-dot.inactive {
      background: #EAB308;
      box-shadow: 0 0 10px #EAB308;
    }

    .smtp-text {
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    .smtp-text strong {
      color: #fff;
    }

    /* MESSAGES LIST */
    .messages-grid {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .message-card {
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 1.8rem;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: all 0.25s ease;
    }

    .message-card:hover {
      border-color: rgba(255, 255, 255, 0.35);
      background: var(--card-bg-hover);
    }

    .message-card.unread {
      border-left: 4px solid var(--accent-orange);
    }

    .msg-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .sender-details {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .sender-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
    }

    .sender-email {
      font-size: 0.9rem;
      color: var(--accent-blue);
      text-decoration: none;
    }

    .msg-badges-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-type {
      background: rgba(61, 126, 255, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(61, 126, 255, 0.3);
    }

    .badge-status {
      background: rgba(255, 90, 31, 0.15);
      color: var(--accent-orange);
      border: 1px solid rgba(255, 90, 31, 0.3);
    }

    .badge-replied {
      background: rgba(52, 211, 153, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .msg-timestamp {
      font-size: 0.82rem;
      color: var(--text-dim);
    }

    .msg-body-content {
      font-size: 0.98rem;
      color: rgba(255, 255, 255, 0.9);
      line-height: 1.6;
      background: rgba(0, 0, 0, 0.25);
      padding: 1.2rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      white-space: pre-wrap;
    }

    .msg-actions-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.8rem;
      padding-top: 0.5rem;
    }

    .btn-sm {
      padding: 0.45rem 0.95rem;
      font-size: 0.82rem;
      border-radius: 9999px;
      cursor: pointer;
      font-weight: 700;
      border: 1px solid var(--border-subtle);
      background: transparent;
      color: #fff;
      transition: all 0.2s ease;
    }

    .btn-sm:hover {
      border-color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-reply {
      background: var(--accent-orange);
      border-color: var(--accent-orange);
      color: #fff;
    }

    .btn-reply:hover {
      background: #e64a12;
      border-color: #e64a12;
    }

    .btn-danger {
      color: #f87171;
      border-color: rgba(248, 113, 113, 0.3);
    }

    .btn-danger:hover {
      background: rgba(248, 113, 113, 0.15);
      border-color: #f87171;
    }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 5rem 2rem;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.02);
    }

    .empty-state h3 {
      font-size: 1.4rem;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .empty-state p {
      color: var(--text-muted);
      max-width: 440px;
      margin: 0 auto;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1.5rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #0f121d;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      width: 100%;
      max-width: 600px;
      padding: 2.2rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .modal-header h3 {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 1.3rem;
      cursor: pointer;
    }

    .modal-close:hover {
      color: #fff;
    }

    .modal-input, .modal-textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      color: #fff;
      padding: 0.8rem 1rem;
      font-family: inherit;
      font-size: 0.95rem;
      margin-bottom: 1.2rem;
      outline: none;
    }

    .modal-input:focus, .modal-textarea:focus {
      border-color: var(--accent-orange);
    }

    .modal-textarea {
      min-height: 140px;
      resize: vertical;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="container nav-inner">
      <a href="index.html" class="brand-logo">
        <span>Lawish Kumar</span>
        <span class="dot"></span>
      </a>
      <div class="nav-links">
        <a href="index.html">← Back to Portfolio</a>
        <a href="projects.html">Projects</a>
      </div>
    </div>
  </header>

  <main class="container">
    
    <div class="inbox-top-bar">
      <div class="inbox-title">
        <h1>Received Inquiries &amp; Messages</h1>
        <p>Manage, inspect, and reply to contact form submissions from your portfolio.</p>
      </div>
      <div class="inbox-actions-group">
        <button class="btn btn-outline" onclick="fetchMessages()">↻ Refresh</button>
      </div>
    </div>

    <!-- SMTP Connection Status Banner -->
    <div class="smtp-banner" id="smtpBanner">
      <div class="smtp-info">
        <span class="status-dot inactive" id="statusDot"></span>
        <div class="smtp-text" id="statusText">Checking server status...</div>
      </div>
      <div id="smtpHelp" style="font-size: 0.85rem; color: var(--text-dim);">
        Edit <code>.env</code> to enable live Gmail / Outlook delivery.
      </div>
    </div>

    <!-- Messages List Container -->
    <div class="messages-grid" id="messagesList">
      <div class="empty-state">
        <h3>Loading messages...</h3>
        <p>Connecting to backend API...</p>
      </div>
    </div>

  </main>

  <!-- Reply Modal -->
  <div class="modal-overlay" id="replyModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="replyModalTitle">Reply to Inquirer</h3>
        <button class="modal-close" onclick="closeReplyModal()">&times;</button>
      </div>
      <div>
        <label style="font-size: 0.8rem; color: var(--text-dim); display: block; margin-bottom: 0.4rem;">REPLY TO</label>
        <input type="text" id="replyRecipient" class="modal-input" readonly />

        <label style="font-size: 0.8rem; color: var(--text-dim); display: block; margin-bottom: 0.4rem;">SUBJECT</label>
        <input type="text" id="replySubject" class="modal-input" placeholder="Subject..." />

        <label style="font-size: 0.8rem; color: var(--text-dim); display: block; margin-bottom: 0.4rem;">MESSAGE</label>
        <textarea id="replyText" class="modal-textarea" placeholder="Type your email reply here..."></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeReplyModal()">Cancel</button>
        <button class="btn btn-primary" id="sendReplyBtn" onclick="sendReply()">Send Reply Email &rarr;</button>
      </div>
    </div>
  </div>

  <script>
    let activeMessageId = null;

    async function checkHealth() {
      try {
        const res = await fetch('/api/health');
        const data = await res.json();
        const dot = document.getElementById('statusDot');
        const text = document.getElementById('statusText');

        if (data.smtpConfigured) {
          dot.className = 'status-dot active';
          text.innerHTML = `Live SMTP Connected &bull; Sending to <strong>${data.notificationEmail}</strong>`;
        } else {
          dot.className = 'status-dot inactive';
          text.innerHTML = `Local Inbox Mode active &bull; Storing all messages safely in local database.`;
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function fetchMessages() {
      try {
        const res = await fetch('/api/messages');
        const data = await res.json();
        const container = document.getElementById('messagesList');

        if (!data.messages || data.messages.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <h3>No Messages Yet</h3>
              <p>When visitors submit the contact form on your portfolio, their inquiries will appear here automatically.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = data.messages.map(m => {
          const isUnread = m.status === 'new' || m.status === 'unread';
          const isReplied = m.status === 'replied';
          const dateStr = new Date(m.receivedAt).toLocaleString();

          return `
            <div class="message-card ${isUnread ? 'unread' : ''}">
              <div class="msg-header-row">
                <div class="sender-details">
                  <div class="sender-name">${escapeHtml(m.name)}</div>
                  <a href="mailto:${escapeHtml(m.email)}" class="sender-email">${escapeHtml(m.email)}</a>
                </div>
                <div class="msg-badges-row">
                  <span class="badge badge-type">${escapeHtml(m.projectType)}</span>
                  <span class="badge ${isReplied ? 'badge-replied' : 'badge-status'}">${m.status}</span>
                  <span class="msg-timestamp">${dateStr}</span>
                </div>
              </div>

              <div class="msg-body-content">${escapeHtml(m.message)}</div>

              ${m.replies && m.replies.length > 0 ? `
                <div style="background: rgba(52, 211, 153, 0.08); border-left: 3px solid var(--accent-green); padding: 0.8rem 1rem; border-radius: 8px; font-size: 0.88rem; color: #bbb;">
                  <strong style="color: var(--accent-green);">Your Sent Reply (${new Date(m.replies[m.replies.length - 1].sentAt).toLocaleDateString()}):</strong><br/>
                  ${escapeHtml(m.replies[m.replies.length - 1].replyText)}
                </div>
              ` : ''}

              <div class="msg-actions-row">
                <button class="btn-sm btn-reply" onclick="openReplyModal('${m.id}', '${escapeHtml(m.email)}', '${escapeHtml(m.name)}')">✉ Reply via Email</button>
                <button class="btn-sm" onclick="toggleStatus('${m.id}', '${m.status === 'read' ? 'unread' : 'read'}')">Mark as ${m.status === 'read' ? 'Unread' : 'Read'}</button>
                <button class="btn-sm btn-danger" onclick="deleteMessage('${m.id}')">Delete</button>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('Error fetching messages:', err);
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function openReplyModal(id, email, name) {
      activeMessageId = id;
      document.getElementById('replyRecipient').value = `${name} <${email}>`;
      document.getElementById('replySubject').value = `Re: Your inquiry on Lawish Kumar Portfolio`;
      document.getElementById('replyText').value = '';
      document.getElementById('replyModal').classList.add('active');
    }

    function closeReplyModal() {
      document.getElementById('replyModal').classList.remove('active');
      activeMessageId = null;
    }

    async function sendReply() {
      if (!activeMessageId) return;
      const text = document.getElementById('replyText').value.trim();
      const subject = document.getElementById('replySubject').value.trim();

      if (!text) {
        alert('Please enter your reply message.');
        return;
      }

      const btn = document.getElementById('sendReplyBtn');
      btn.innerText = 'Sending...';
      btn.disabled = true;

      try {
        const res = await fetch(`/api/messages/${activeMessageId}/reply`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ replyMessage: text, subject: subject })
        });
        const data = await res.json();
        if (data.success) {
          alert(data.message);
          closeReplyModal();
          fetchMessages();
        } else {
          alert('Error: ' + data.error);
        }
      } catch (e) {
        alert('Network error while sending reply.');
      } finally {
        btn.innerText = 'Send Reply Email →';
        btn.disabled = false;
      }
    }

    async function toggleStatus(id, newStatus) {
      try {
        await fetch(`/api/messages/${id}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        fetchMessages();
      } catch (e) {
        console.error(e);
      }
    }

    async function deleteMessage(id) {
      if (!confirm('Are you sure you want to delete this message?')) return;
      try {
        await fetch(`/api/messages/${id}`, { method: 'DELETE' });
        fetchMessages();
      } catch (e) {
        console.error(e);
      }
    }

    // Initial load
    checkHealth();
    fetchMessages();
  </script>
</body>
</html>
